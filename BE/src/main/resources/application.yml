# Environment variables:
#   DB_PASSWORD      required, has no default and must never be committed
#   DB_URL           optional, defaults to the local p02_training database
#   DB_USERNAME      optional, defaults to postgres
#   FRONTEND_ORIGIN  optional, the only origin allowed by CORS
#   SERVER_PORT      optional, defaults to 8080

spring:
  application:
    name: p02-training-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/p02_training}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    # Stay off: a non-empty database must stop startup, not get baselined silently.
    baseline-on-migrate: false

  jackson:
    time-zone: Asia/Ho_Chi_Minh

  web:
    resources:
      # REST API only, so unknown paths are 404s and not static resource lookups.
      add-mappings: false

server:
  port: ${SERVER_PORT:8080}
  # Last line of defence for errors that never reach GlobalExceptionHandler.
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"

app:
  business-zone: Asia/Ho_Chi_Minh
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
